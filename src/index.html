  <body>
    <!-- Reveal targets are visible by default and only start hidden once this runs, so if
         the motion layer fails to initialise the page stays readable instead of blank. -->
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-motion");
      }
    </script>
    <!-- Vercel Web Analytics (cookieless). Injected at runtime so the bundler leaves the
         Vercel-served path alone, and skipped locally so dev visits are not counted. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        var va = document.createElement("script");
        va.defer = true;
        va.src = "/_vercel/insights/script.js";
        document.head.appendChild(va);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
